<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رادیو آنلاین | طاها جبرائیلی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">🎵 رادیو طاها</div>
        <a href="/">← بازگشت به سایت</a>
    </header>

    <!-- PLAYER -->
    <div class="player-container">

        <h1 class="player-title">رادیو <span>آنلاین</span></h1>
        <p class="player-sub">یه استیشن رو انتخاب کن و لذت ببر 🎧</p>

        <!-- iframe Player -->
        <div class="iframe-wrapper" id="iframeWrapper">
            <div class="no-iframe-msg" id="noIframeMsg">
                🎵 یه رادیو رو انتخاب کن تا پخش بشه
            </div>
            <iframe id="audioIframe" style="display:none;" allow="autoplay"></iframe>
        </div>

        <!-- Radio List -->
        <div class="radio-list" id="radioList"></div>

        <div class="footer">
            ساخته‌شده توسط <a href="/">طاها جبرائیلی❤️</a>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
